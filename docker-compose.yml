services:
  vps-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-vps-panel
    restart: unless-stopped
    ports:
      - "20276:20276"
    environment:
      PORT: "20276"
      RUN_BOT: "0"
      BASE_PATH: /app/panel_data
    volumes:
      - panel_data:/app/panel_data

volumes:
  panel_data:
